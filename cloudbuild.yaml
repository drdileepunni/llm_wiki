steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cds-pipeline/cds-pipeline:$BUILD_ID"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cds-pipeline/cds-pipeline:$BUILD_ID"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cds-pipeline
      - "--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cds-pipeline/cds-pipeline:$BUILD_ID"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=cds-pipeline-runner@$PROJECT_ID.iam.gserviceaccount.com"
      - "--memory=4Gi"
      - "--cpu=2"
      - "--timeout=3600"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--set-env-vars=GCS_BUCKET=patientview-cds-pipeline-ops,MODEL=gemini-2.0-flash-lite,REASONING_MODEL=gemini-2.0-flash-lite,WIKI_ROOT=/app"
      - "--set-secrets=GOOGLE_API_KEY=GEMINI_API_KEY:latest,RADAR_READ_SERVICE_ACCOUNT=RADAR_READ_SERVICE_ACCOUNT:latest,PRODTECH_BQ_SA_KEY=PRODTECH_BQ_SA_KEY:latest"

images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/cds-pipeline/cds-pipeline:$BUILD_ID"

options:
  logging: CLOUD_LOGGING_ONLY
