steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cds-pipeline/cds-pipeline:$COMMIT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/cds-pipeline/cds-pipeline:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - cds-pipeline
      - "--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cds-pipeline/cds-pipeline:$COMMIT_SHA"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--no-allow-unauthenticated"
      - "--service-account=cds-pipeline-runner@$PROJECT_ID.iam.gserviceaccount.com"
      - "--memory=4Gi"
      - "--cpu=2"
      - "--timeout=3600"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--set-env-vars=GCS_BUCKET=cds-pipeline-ops,BQ_SERVICE_URL=https://bigquery-service-971880579407.us-central1.run.app,MODEL=gemini-2.0-flash-lite,REASONING_MODEL=gemini-2.0-flash-lite,WIKI_ROOT=/app"
      - "--set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,RADAR_READ_SERVICE_ACCOUNT=RADAR_READ_SERVICE_ACCOUNT:latest"

images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/cds-pipeline/cds-pipeline:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
