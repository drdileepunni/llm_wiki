<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CDS Pipeline{% endblock %} — Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4 py-2 d-flex align-items-center gap-3">
  <span class="navbar-brand fw-bold mb-0">
    <i class="bi bi-activity me-1 text-success"></i>CDS Pipeline
  </span>
  <div class="d-flex gap-3 ms-3">
    <a class="nav-link {% if request.path == '/' %}active fw-semibold{% endif %}" href="/">
      <i class="bi bi-bar-chart-line me-1"></i>Metrics
    </a>
    <a class="nav-link {% if request.path == '/config' %}active fw-semibold{% endif %}" href="/config">
      <i class="bi bi-sliders me-1"></i>Config
    </a>
    <a class="nav-link {% if request.path == '/audit' %}active fw-semibold{% endif %}" href="/audit">
      <i class="bi bi-list-check me-1"></i>Run Audit
    </a>
    <a class="nav-link {% if request.path == '/doc-audits' %}active fw-semibold{% endif %}" href="/doc-audits">
      <i class="bi bi-clipboard-check me-1"></i>Doc Audits
    </a>
    <a class="nav-link {% if request.path == '/docs' %}active fw-semibold{% endif %}" href="/docs">
      <i class="bi bi-diagram-3 me-1"></i>Docs
    </a>
  </div>
</nav>

<div class="container-fluid px-4 py-3">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: false, theme: 'default' });</script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
